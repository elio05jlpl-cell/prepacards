<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" type="application/rss+xml" title="PrépaCards — Blog" href="/rss.xml">

<meta property="og:type" content="website">
<meta property="og:site_name" content="PrépaCards">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{og_image}}">

<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/icone-180.png">
<link rel="stylesheet" href="/style.css?v={{version_css}}">
<link rel="preload" href="/fonts/libre-franklin-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/poppins-800-latin.woff2" as="font" type="font/woff2" crossorigin>
{{jsonld}}
</head>
<body>

<a class="saut-contenu" href="#contenu">Aller au contenu</a>

<div class="bandeau-haut">
  <div class="conteneur bandeau-haut-interieur">
    <div class="reseaux" aria-label="Réseaux sociaux">{{reseaux}}</div>
    <div class="bandeau-actions">
      <a class="nav-connexion" href="/compte/">Se connecter</a>
      <a class="bouton-nav" href="/telecharger/">Télécharger</a>
    </div>
  </div>
</div>

<header class="entete">

  <div class="conteneur entete-marque">
    <a class="marque" href="/">
      <img src="/img/logo.png" width="34" height="34" alt="" loading="eager">
      <span>Prépa<strong>Cards</strong></span>
    </a>
    <button class="burger" aria-label="Ouvrir le menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>

</header>

<div class="entete-nav-barre">
  <div class="conteneur entete-nav">
    <nav class="navigation" aria-label="Navigation principale">
        {{nav}}
    </nav>
  </div>
</div>

<main id="contenu">
{{content}}
</main>

<footer class="pied">
  <div class="conteneur">
    <nav class="pied-haut" aria-label="Liens de pied de page">
      <div class="pied-marque">
        <img src="/img/logo.png" width="72" height="72" alt="PrépaCards" loading="lazy">
        <span>Prépa<strong>Cards</strong></span>
      </div>
      {{footer_links}}
    </nav>
    <p class="pied-bas">© {{year}} PrépaCards — Application indépendante,
       sans lien avec Anki ni Quizlet.</p>
  </div>
</footer>

<script>
// Marque tout de suite que JavaScript fonctionne : les regles d'apparition
// ne s'appliquent qu'a ce moment-la. Sans ce drapeau, un visiteur dont le
// script echoue verrait une page vide de contenu masque.
document.documentElement.classList.add('js');

(function () {
  var doux = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cibles = document.querySelectorAll('.revelation, .a-reveler');

  if (doux || !('IntersectionObserver' in window)) {
    // Navigateur ancien ou mouvement reduit : on affiche tout, sans animer.
    cibles.forEach(function (e) { e.classList.add('vue'); });
  } else {
    var observateur = new IntersectionObserver(function (entrees) {
      entrees.forEach(function (entree) {
        if (!entree.isIntersecting) return;
        entree.target.classList.add('vue');
        // Une fois apparu, l'element n'a plus a etre surveille : sinon il
        // rejouerait l'animation a chaque remontee dans la page.
        observateur.unobserve(entree.target);
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.05 });
    cibles.forEach(function (e) { observateur.observe(e); });
  }

  // En-tete : une ombre apparait des que la page defile, pour la detacher
  // du contenu qui passe dessous.
  var entete = document.querySelector('.entete-nav-barre');
  if (entete) {
    var majDefile = function () {
      entete.classList.toggle('abaissee', window.scrollY > 8);
    };
    majDefile();
    window.addEventListener('scroll', majDefile, { passive: true });
  }
})();

// Menu mobile. Volontairement en JavaScript brut : quelques lignes suffisent,
// et charger un framework pour cela ralentirait chaque page - ce qui pese
// reellement sur le referencement.
(function () {
  var burger = document.querySelector('.burger');
  var nav = document.querySelector('.navigation');
  if (!burger || !nav) return;
  burger.addEventListener('click', function () {
    var ouvert = nav.classList.toggle('ouvert');
    burger.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
  });
})();

// Menu "Matieres" et sous-menus : pilotes par CSS (:hover / :focus-within),
// pour continuer a fonctionner si ce script echoue a charger. Ce bloc se
// contente de refleter l'etat reel dans aria-expanded, que la construction
// du site pose a "false" une fois pour toutes - sans lui, un lecteur
// d'ecran annoncerait un menu ferme alors qu'il est ouvert sous les yeux
// d'un visiteur voyant.
(function () {
  var groupes = [].slice.call(document.querySelectorAll('.nav-groupe'));
  if (!groupes.length) return;

  function declencheur(groupe) {
    return groupe.querySelector('.nav-lien[aria-haspopup="true"]');
  }
  function ouvertParCss(groupe) {
    return groupe.matches(':hover') || groupe.matches(':focus-within');
  }
  function actualiser(groupe) {
    var lien = declencheur(groupe);
    if (!lien) return;
    var force = groupe.classList.contains('nav-force-ferme');
    lien.setAttribute('aria-expanded', (!force && ouvertParCss(groupe)) ? 'true' : 'false');
  }

  groupes.forEach(function (groupe) {
    groupe.addEventListener('mouseenter', function () {
      groupe.classList.remove('nav-force-ferme');
      actualiser(groupe);
    });
    groupe.addEventListener('mouseleave', function () { actualiser(groupe); });
    groupe.addEventListener('focusin', function () { actualiser(groupe); });
    // Le focus quitte entierement le groupe : la fermeture forcee au
    // clavier n'a plus de raison de durer au-dela de ce passage.
    groupe.addEventListener('focusout', function () {
      groupe.classList.remove('nav-force-ferme');
      actualiser(groupe);
    });
  });

  // Echap ferme le menu ouvert et rend le focus a son declencheur, sans que
  // ce regain de focus ne le rouvre aussitot via :focus-within.
  document.addEventListener('keydown', function (evenement) {
    if (evenement.key !== 'Escape') return;
    var ouvert = groupes.filter(ouvertParCss)[0];
    if (!ouvert) return;
    ouvert.classList.add('nav-force-ferme');
    var lien = declencheur(ouvert);
    if (lien) lien.focus();
    actualiser(ouvert);
  });
})();

// Accordeon mobile : sans survol possible au doigt, un premier appui sur un
// lien qui a des enfants les deplie au lieu de naviguer tout de suite ; le
// lien reste un lien normal et un second appui, une fois deplie, navigue.
(function () {
  function mobile() {
    return window.matchMedia('(max-width: 900px)').matches;
  }

  document.querySelectorAll('.nav-groupe > .nav-lien[aria-haspopup="true"]').forEach(function (lien) {
    lien.addEventListener('click', function (evenement) {
      if (!mobile()) return;
      var groupe = lien.closest('.nav-groupe');
      if (groupe.classList.contains('ouvert')) return;
      evenement.preventDefault();
      groupe.classList.add('ouvert');
      lien.setAttribute('aria-expanded', 'true');
    });
  });

  document.querySelectorAll('.mega-filiere').forEach(function (lien) {
    lien.addEventListener('click', function (evenement) {
      if (!mobile()) return;
      var item = lien.closest('.mega-item');
      if (item.classList.contains('ouvert')) return;
      evenement.preventDefault();
      item.classList.add('ouvert');
    });
  });
})();

</script>
{{script_etapes}}
</body>
</html>
